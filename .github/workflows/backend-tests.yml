name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: gemlink_test
          POSTGRES_USER: gemlink
          POSTGRES_PASSWORD: MimineForEver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gemlink -d gemlink_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: test-app-secret
      DATABASE_URL: postgresql://gemlink:MimineForEver@127.0.0.1:5432/gemlink?serverVersion=16&charset=utf8
      REDIS_URL: redis://127.0.0.1:6379
      MESSENGER_TRANSPORT_DSN: redis://127.0.0.1:6379/messages
      MESSENGER_FAILED_TRANSPORT_DSN: doctrine://default?queue_name=failed
      MAILER_DSN: 'null://null'
      MAILER_FROM_EMAIL: noreply@example.test
      MAILER_FROM_NAME: GemLink Tests
      FRONTEND_URL: http://localhost:4200
      APP_URL: http://localhost:8000
      DEFAULT_URI: http://localhost
      MEDIA_STORAGE_MODE: local
      AI_SERVICE_URL: http://ai.invalid
      INTERNAL_API_KEY: test-internal-key
      INFOMANIAK_NEWSLETTER_TOKEN: test-token
      INFOMANIAK_NEWSLETTER_DOMAIN_ID: '1'
      JWT_SECRET_KEY: config/jwt/private.pem
      JWT_PUBLIC_KEY: config/jwt/public.pem
      JWT_PASSPHRASE: ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@fcafdd6392932010c2bd5094439b8e33be2a8a09 # 2.37.0
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, redis, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php bin/console doctrine:migrations:migrate --no-interaction
      - run: php bin/console lint:container --env=test
      - run: php bin/phpunit
