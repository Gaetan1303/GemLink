<app-header /><main class="conversations-page messages-page" id="main-content"><h1>Messages</h1>@if(isLoading()){<p>Chargement…</p>}@else if(loadError()){<p role="alert">{{loadError()}}</p>}@else if(!conversations().length){<p>Aucune conversation.</p>}@else{<ul class="conversations-list">@for(conversation of conversations();track conversation.id){<li><button type="button" (click)="open(conversation.id)">@if(conversation.avatarUrl){<img [src]="conversation.avatarUrl" [alt]="'Avatar de '+conversation.title" />}<span><strong>{{conversation.title}}</strong><small>{{conversation.type==='FACTION'?'Faction':'Direct'}}</small><span>{{conversation.lastMessage?.content||'Aucun message'}}</span></span>@if(conversation.unreadCount){<span class="unread" [attr.aria-label]="conversation.unreadCount+' messages non lus'">{{conversation.unreadCount}}</span>}</button></li>}</ul>}</main><app-footer />
