<app-header /><main class="faction-new-page community-page" id="main-content"><section class="create-faction"><h1>Créer une faction</h1>@if(error()){<p role="alert">{{error()}}</p>}<form [formGroup]="form" (ngSubmit)="submit()"><label>Nom<input formControlName="name" maxlength="100" required /></label>@if(form.controls.name.touched&&form.controls.name.invalid){<small>Le nom doit contenir entre 3 et 100 caractères.</small>}<label>Description<textarea formControlName="description" maxlength="2000" rows="6"></textarea></label><label>Visibilité<select formControlName="visibility"><option value="PUBLIC">Publique</option><option value="PRIVATE">Privée</option></select></label><button class="btn" type="submit" [disabled]="submitting()">{{submitting()?'Création…':'Créer'}}</button></form></section></main><app-footer />
