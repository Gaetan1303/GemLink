<div class="cookie-banner-container">
  <div class="cookie-banner-content">
    <p>
      Nous utilisons des cookies pour améliorer votre expérience. En cliquant sur "Accepter", vous consentez à l'utilisation de cookies non essentiels pour la mesure d'audience.
    </p>
    <div class="cookie-banner-actions">
      <button mat-flat-button color="primary" (click)="accept()">Accepter</button>
      <button mat-stroked-button (click)="refuse()">Refuser</button>
    </div>
  </div>
</div>
