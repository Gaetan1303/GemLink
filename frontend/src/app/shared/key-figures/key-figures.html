<section class="key-figures">
  <h2>Chiffres clés</h2>
  <div class="figures-container" role="list">
    <div class="figure" *ngFor="let figure of figures" role="listitem">
      <span class="figure-number">{{ figure.number }}</span>
      <span class="figure-label">{{ figure.label }}</span>
    </div>
  </div>
</section>
