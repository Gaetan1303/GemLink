<span
  class="analysis-badge"
  [class.analysis-badge--sm]="size === 'sm'"
  [ngClass]="{
    'analysis-badge--pending':  status === 'PENDING_ANALYSIS',
    'analysis-badge--failed':   status === 'ANALYSIS_FAILED',
    'analysis-badge--analyzed': status === 'ANALYZED'
  }"
  [@statusChange]="status"
>
  @if (status === 'PENDING_ANALYSIS') {
    <span class="analysis-badge__dot"></span>
    Analyse IA en cours…
  } @else if (status === 'ANALYSIS_FAILED') {
    <mat-icon>error_outline</mat-icon>
    Non identifiée
  } @else {
    <mat-icon>auto_awesome</mat-icon>
    Identifiée
  }
</span>
