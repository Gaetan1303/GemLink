<div class="validate-email-page">
  <app-header></app-header>

  <main class="validate-email">
    <section class="validate-email__panel" [class.validate-email__panel--error]="state() === 'error'">
      @if (state() === 'loading') {
        <p class="validate-email__status">Merci de patienter</p>
      }
      @if (state() === 'success') {
        <p class="validate-email__status">Compte activé</p>
      }
      @if (state() === 'error') {
        <p class="validate-email__status">Validation impossible</p>
      }

      <h1>{{ message() }}</h1>

      @if (state() === 'success') {
        <a routerLink="/auth/login" class="validate-email__link">Aller à la connexion</a>
      }
      @if (state() === 'error') {
        <a routerLink="/auth/register" class="validate-email__link">Créer un compte</a>
      }
    </section>
  </main>

  <app-footer></app-footer>
</div>
