services:
  database_test:
    image: pgvector/pgvector:pg16
    container_name: gemlink_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: gemlink
      POSTGRES_PASSWORD: MimineForEver
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemlink -d database_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data