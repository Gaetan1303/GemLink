
services:
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: gemlink_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gemlink}
      POSTGRES_USER: ${POSTGRES_USER:-gemlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MimineForEver}

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gemlink} -d ${POSTGRES_DB:-gemlink}"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - database_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data:rw

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  redis_data:
