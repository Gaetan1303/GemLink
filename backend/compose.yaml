services:
  php:
    build:
      dockerfile: Dockerfile
    container_name: gemlink_php
    restart: unless-stopped

    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-gemlink}
      DB_USER: ${POSTGRES_USER:-gemlink}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-MimineForEver}
      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "8000:8080"

    volumes:
      - .:/app

    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
  database:
    image: pgvector/pgvector:pg16
    container_name: gemlink_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gemlink}
      POSTGRES_USER: ${POSTGRES_USER:-gemlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MimineForEver}

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gemlink} -d ${POSTGRES_DB:-gemlink}"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - database_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gemlink_redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - yes

    ports:
      - "6380:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - redis_data:/data
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gemlink_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gemlink.com
      PGADMIN_DEFAULT_PASSWORD: AdminPassword123!

    ports:
      - "8080:80"

    depends_on:
      database:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  database_data:
  redis_data:
  pgadmin_data:
