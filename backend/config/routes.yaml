# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json
controllers:
    resource: routing.controllers

app_cors_preflight:
    path: '/{url}'
    methods: [OPTIONS]
    defaults:
        _controller: 'Symfony\Bundle\FrameworkBundle\Controller\TemplateController'
    requirements:
        url: '.*'