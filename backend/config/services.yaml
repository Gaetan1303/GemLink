parameters:
    env(CLOUDFLARE_AI_ENABLED): 'false'
    env(CLOUDFLARE_ACCOUNT_ID): ''
    env(CLOUDFLARE_AI_API_TOKEN): ''
    env(CLOUDFLARE_AI_MODEL): ''
    env(CLOUDFLARE_AI_FALLBACK_MODEL): ''
    env(CLOUDFLARE_AI_TIMEOUT): '20'
    env(CLOUDFLARE_AI_MAX_RETRIES): '1'
    env(STONE_AI_AUTO_ACCEPT_THRESHOLD): '0.85'
    env(STONE_AI_REVIEW_THRESHOLD): '0.55'
    env(CLOUDFLARE_AI_RATE_LIMIT_PER_USER): '10'
    env(CLOUDFLARE_AI_USER_DAILY_QUOTA): '20'
    env(CLOUDFLARE_AI_DAILY_QUOTA): '500'
    app.admin_fixture_password_default: ''
    # MAILER
    app.mailer_from_email: '%env(MAILER_FROM_EMAIL)%'
    app.mailer_from_name: '%env(MAILER_FROM_NAME)%'

    # FRONTEND
    app.frontend_url: '%env(resolve:FRONTEND_URL)%'

    # MEDIA
    media.upload_dir: '%kernel.project_dir%/public/uploads'
    media.public_base_url: '%env(resolve:APP_URL)%/uploads'
    media.r2_public_base_url: '%env(R2_PUBLIC_BASE_URL)%'
    # 'local' (dev, disque partagé worker/php) | 'r2' (prod, CDN public)
    # Valeur de repli utilisée par le processeur d'env "default:" ci-dessous
    # — doit être un PARAMÈTRE de conteneur classique, pas un env().
    media.storage_mode_default: 'local'
    media.storage_mode: '%env(default:media.storage_mode_default:MEDIA_STORAGE_MODE)%'

    # INFOMANIAK NEWSLETTER
    infomaniak_newsletter.domain_id: '%env(INFOMANIAK_NEWSLETTER_DOMAIN_ID)%'
    infomaniak_newsletter.token: '%env(INFOMANIAK_NEWSLETTER_TOKEN)%'
    infomaniak_newsletter.api_url: '%env(INFOMANIAK_NEWSLETTER_CLIENT_API_URL)%'

    # AI SERVICE
    app.ai_service_url: '%env(resolve:AI_SERVICE_URL)%'
    app.internal_api_key: '%env(resolve:INTERNAL_API_KEY)%'
    app.ai_enabled: '%env(bool:AI_ENABLED)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $fromEmail: '%app.mailer_from_email%'
            string $fromName: '%app.mailer_from_name%'
            string $frontendUrl: '%app.frontend_url%'
            string $aiServiceUrl: '%app.ai_service_url%'
            string $internalApiKey: '%app.internal_api_key%'
            bool $aiEnabled: '%app.ai_enabled%'
            string $adminFixturePassword: '%env(default:app.admin_fixture_password_default:ADMIN_FIXTURE_PASSWORD)%'

    App\:
        resource: '../src/'

    App\Service\ChatEventPublisherInterface:
        alias: App\Service\NullChatEventPublisher

    # JWT blocklist listener
    App\EventListener\JwtBlocklistListener:
        arguments:
            $cache: '@cache.app'
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_decoded, method: onJwtDecoded }

    # AUTH SERVICE
    App\Service\AuthService:
        arguments:
            $cache: '@cache.app'
            $cachePool: '@cache.app'
            $frontendUrl: '%app.frontend_url%'
            $maxLoginAttempts: 5
            $loginAttemptWindow: 600

    # NEWSLETTER SERVICE
    App\Service\NewsletterCampaignService:
        arguments:
            $token: '%infomaniak_newsletter.token%'
            $domainId: '%infomaniak_newsletter.domain_id%'
            $baseUrl: '%infomaniak_newsletter.api_url%'

    # MEDIA UPLOAD
    App\Service\Media\MediaUploaderInterface:
        alias: App\Service\Media\StorageModeMediaUploader

    App\Service\Media\LocalMediaUploader:
        arguments:
            $uploadDir: '%media.upload_dir%'
            $publicBaseUrl: '%media.public_base_url%'

    Aws\S3\S3Client:
        arguments:
            - version: 'latest'
              region: 'auto'
              endpoint: '%env(R2_ENDPOINT)%'
              use_path_style_endpoint: true
              credentials:
                  key: '%env(R2_ACCESS_KEY_ID)%'
                  secret: '%env(R2_SECRET_ACCESS_KEY)%'

    League\Flysystem\AwsS3V3\AwsS3V3Adapter:
        arguments:
            $client: '@Aws\S3\S3Client'
            $bucket: '%env(R2_BUCKET)%'

    app.r2_filesystem:
        class: League\Flysystem\Filesystem
        arguments: ['@League\Flysystem\AwsS3V3\AwsS3V3Adapter']

    App\Service\Media\R2MediaUploader:
        arguments:
            $filesystem: '@app.r2_filesystem'
            $publicBaseUrl: '%media.r2_public_base_url%'

    App\Service\Media\StorageModeMediaUploader:
        arguments:
            $storageMode: '%media.storage_mode%'

    # US 4.2 - CA-2 : client Redis natif pour VitrineViewCounterService.
    # Service à part entière, au même niveau que les autres sous `services:`
    # (surtout pas imbriqué sous LocalMediaUploader ci-dessus).
    Redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            - '%env(REDIS_URL)%'

    # AI ANALYSIS WORKER — US 3.1 CA-3 : lecture disque en mode 'local'
    # (worker et serveur HTTP partagent le même conteneur/volume), GET HTTP
    # uniquement en mode 'r2' (CDN public, Railway).
    App\MessageHandler\AnalyzeMediaMessageHandler:
        arguments:
            $mediaStorageMode: '%media.storage_mode%'
            $uploadDir: '%media.upload_dir%'
            $localPublicBaseUrl: '%media.public_base_url%'

    App\MessageHandler\AnalyzePublicIdentificationMessageHandler:
        arguments:
            $mediaStorageMode: '%media.storage_mode%'
            $uploadDir: '%media.upload_dir%'
            $localPublicBaseUrl: '%media.public_base_url%'

    App\Controller\PublicIdentificationController:
        arguments:
            $publicIdentificationLimiter: '@limiter.public_identification'

    App\Controller\ConversationController:
        arguments:
            $chatMessageLimiter: '@limiter.chat_message'

    App\EventSubscriber\ProductionConfigurationSubscriber:
        arguments:
            $appSecret: '%env(APP_SECRET)%'
            $jwtPassphrase: '%env(JWT_PASSPHRASE)%'
            $mailerDsn: '%env(MAILER_DSN)%'
            $internalApiKey: '%app.internal_api_key%'
            $mediaStorageMode: '%media.storage_mode%'
            $r2AccessKeyId: '%env(R2_ACCESS_KEY_ID)%'
            $r2AccountId: '%env(R2_ACCOUNT_ID)%'
            $r2SecretAccessKey: '%env(R2_SECRET_ACCESS_KEY)%'
            $r2Bucket: '%env(R2_BUCKET)%'
            $r2Endpoint: '%env(R2_ENDPOINT)%'
            $r2PublicBaseUrl: '%env(R2_PUBLIC_BASE_URL)%'
            $corsAllowOrigin: '%env(CORS_ALLOW_ORIGIN)%'
            $frontendUrl: '%app.frontend_url%'
            $aiServiceUrl: '%app.ai_service_url%'

    App\Service\SecondaryAiReviewerInterface:
        alias: App\Service\CloudflareAiService

    App\Service\Ai\CloudflareAiConfiguration:
        arguments:
            $enabled: '%env(bool:CLOUDFLARE_AI_ENABLED)%'
            $accountId: '%env(CLOUDFLARE_ACCOUNT_ID)%'
            $apiToken: '%env(CLOUDFLARE_AI_API_TOKEN)%'
            $model: '%env(CLOUDFLARE_AI_MODEL)%'
            $fallbackModel: '%env(CLOUDFLARE_AI_FALLBACK_MODEL)%'
            $timeout: '%env(int:CLOUDFLARE_AI_TIMEOUT)%'
            $maxRetries: '%env(int:CLOUDFLARE_AI_MAX_RETRIES)%'
            $autoAcceptThreshold: '%env(float:STONE_AI_AUTO_ACCEPT_THRESHOLD)%'
            $reviewThreshold: '%env(float:STONE_AI_REVIEW_THRESHOLD)%'
            $perUserMinute: '%env(int:CLOUDFLARE_AI_RATE_LIMIT_PER_USER)%'
            $perUserDay: '%env(int:CLOUDFLARE_AI_USER_DAILY_QUOTA)%'
            $dailyQuota: '%env(int:CLOUDFLARE_AI_DAILY_QUOTA)%'

    App\Service\Media\AiMediaReader:
        arguments:
            $mediaStorageMode: '%media.storage_mode%'
            $uploadDir: '%media.upload_dir%'
            $localPublicBaseUrl: '%media.public_base_url%'
            $r2PublicBaseUrl: '%media.r2_public_base_url%'

    App\Service\CloudflareAiService:
        arguments:
            # Reuse Symfony transport without profiler capture of bearer/image data.
            $httpClient: '@http_client.transport'
            $logger: '@monolog.logger.secondary_ai'

    App\Service\AiOrchestrationService:
        arguments:
            $logger: '@monolog.logger.secondary_ai'
