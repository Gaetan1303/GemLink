parameters:
    # Récupère les valeurs depuis le fichier .env
    app.mailer_from_email: '%env(MAILER_FROM_EMAIL)%'
    app.mailer_from_name: '%env(MAILER_FROM_NAME)%'
    app.frontend_url: '%env(resolve:FRONTEND_URL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $fromEmail: '%app.mailer_from_email%'
            string $fromName: '%app.mailer_from_name%'
            string $frontendUrl: '%app.frontend_url%'
    
    App\:
        resource: '../src/'


