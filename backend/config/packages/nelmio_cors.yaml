nelmio_cors:
    defaults:
        allow_credentials: true
        # Anchored regex supplied by the environment. Production must match only
        # GemLink's Cloudflare domains and never use ".*" with credentials.
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_headers: ['Content-Type', 'Authorization']
        # Les endpoints d'administration (rôle, bannissement, paramètres)
        # utilisent PATCH : le préflight doit l'autoriser aussi hors Caddy.
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
        max_age: 3600

    paths:
        '^/': ~
