nelmio_cors:
    defaults:
        allow_credentials: true
        allow_origin: ['http://localhost:4200']
        allow_headers: ['Content-Type', 'Authorization']
        # Les endpoints d'administration (rôle, bannissement, paramètres)
        # utilisent PATCH : le préflight doit l'autoriser aussi hors Caddy.
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
        max_age: 3600

    paths:
        '^/': ~
