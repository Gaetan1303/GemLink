framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000

            failed:
                dsn: '%env(MESSENGER_FAILED_TRANSPORT_DSN)%'

        routing:
            'App\Message\SendEmailMessage': async
            'App\Message\AnalyzeMediaMessage': async