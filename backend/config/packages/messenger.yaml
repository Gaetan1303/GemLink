framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000

            failed:
                dsn: '%env(MESSENGER_FAILED_TRANSPORT_DSN)%'

            low_priority:
                dsn: '%env(REDIS_URL)%/identification_low_priority'
                retry_strategy:
                    service: App\Messenger\AnalyzeMediaRetryStrategy

        routing:
            'App\Message\SendEmailMessage': async
            'App\Message\AnalyzeMediaMessage': async
            'App\Message\AnalyzePublicIdentificationMessage': low_priority
            'App\Message\RecalculateConsensusMessage': async
            'App\Message\RunFineTuningMessage': async
            'App\Message\AwardPointsMessage': async
