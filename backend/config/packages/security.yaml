security:
    password_hashers:
        App\Entity\User:
            algorithm: argon2id

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # US 4.2 - CA-1 : page publique d'une Vitrine, accessible sans JWT.
        # Pattern avec le slash final : ^/api/public seul matcherait aussi
        # /api/publications (préfixe commun "public"), ce qui désactiverait
        # la sécurité sur une route qui doit rester authentifiée pour ses
        # actions d'écriture. Doit être déclaré avant le firewall "api"
        # (les firewalls sont évalués dans l'ordre, premier match gagnant).
        vitrine_public:
            pattern: ^/api/public/
            security: false
        login:
            pattern: ^/api/login_check$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/login_check$, roles: PUBLIC_ACCESS }
        - { path: ^/api/(docs|contexts|openapi), roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [OPTIONS] }
        # US 1.5 : logout requiert un utilisateur authentifié
        - { path: ^/api/auth/logout$, roles: IS_AUTHENTICATED_FULLY }
        # US 2.2 : liste/détail des posts publics (visiteur non authentifié inclus)
        # US 2.4 CA-3 : lecture des commentaires publique elle aussi ; doit
        # être déclarée avant la règle générique ^/api/publications ci-dessous
        # pour ne pas être masquée (elle matcherait de toute façon, mais on
        # garde l'ordre explicite pour la lisibilité).
        - { path: '^/api/publications/[^/]+/comments', roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/publications, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: argon2id
                time_cost: 2
                memory_cost: 10
                # 'threads' is not a recognized option for Symfony password_hashers configuration