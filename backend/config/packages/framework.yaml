# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    session: false
    rate_limiter:
        email_validation_resend:
            policy: 'fixed_window'
            limit: 3
            interval: '1 hour'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
