api_platform:
    title: GemLink API
    version: 0.1.0
    enable_docs: false
    enable_entrypoint: false
    enable_swagger: false
    enable_swagger_ui: false
    enable_re_doc: false
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

when@dev:
    api_platform:
        enable_docs: true
        enable_entrypoint: true
        enable_swagger: true
        enable_swagger_ui: true
        enable_re_doc: true
