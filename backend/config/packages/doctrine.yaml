doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '16'
        mapping_types:
            ai_model_status: string
            ai_model_type: string
            badge_condition_type: string
            fine_tune_status: string
            group_visibility: string
            invoice_status: string
            media_type: string
            point_action_type: string
            post_status: string
            report_reason: string
            report_status: string
            tag_scope: string
            user_role: string
            user_status: string
            validation_action: string
            vitrine_status: string
            vector: vector
        schema_filter: '~^(?!idx_embedding_vector_hnsw|idx_publication_fts|idx_pierre_fts|idx_publication_feed|set_timestamp_|auto_moderate_|update_trust_score_|protect_audit_log_)~'
        types:
            vector: Pgvector\Doctrine\VectorType
            halfvec: Pgvector\Doctrine\HalfVectorType
            sparsevec: Pgvector\Doctrine\SparseVectorType

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

framework:
    cache:
        pools:
            doctrine.result_cache_pool:
                adapter: cache.app
            doctrine.system_cache_pool:
                adapter: cache.system
