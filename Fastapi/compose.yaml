# docker-compose.ai.yml
#
# Fichier À FUSIONNER avec votre compose.yaml existant (celui de Symfony), pas à
# lancer seul. Usage :
#
#   docker compose -f compose.yaml -f docker-compose.ai.yml up -d
#
# Principe de sécurité réseau :
# - "ai-orchestrator" et "ollama" n'ont PAS de section "ports:" → aucun port
#   n'est publié sur l'hôte, donc inaccessible depuis l'extérieur du conteneur,
#   y compris depuis votre machine (localhost:XXXX ne répondra pas).
# - On utilise "expose:" à la place, qui documente le port pour les AUTRES
#   conteneurs du même réseau Docker, sans le publier sur l'hôte.
# - Seul "php" (Symfony) est sur le même réseau "gemlink-network" et peut donc
#   appeler http://ai-orchestrator:3000/analyze directement, en DNS interne
#   Docker — jamais via une IP ou un port публic.
# - Si vous exposez malgré tout un port par erreur, le header X-Internal-Key
#   (voir main.py) reste un filet de sécurité supplémentaire, pas un remplacement.

services:
  # ── Backend Symfony : on ajoute juste les variables nécessaires pour
  #    joindre le service IA, sans toucher au reste de sa config ──
  php:
    environment:
      AI_SERVICE_URL: http://ai-orchestrator:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    networks:
      - gemlink-network
    depends_on:
      ai-orchestrator:
        condition: service_healthy

  # ── Orchestrateur IA (FastAPI : YOLO + ViT + proxy Ollama) ──
  ai-orchestrator:
    build:
      context: ./ai  # adaptez au chemin réel du repo Fastapi cloné localement
      dockerfile: Dockerfile
    container_name: gemlink_ai_orchestrator
    restart: unless-stopped

    # PAS de "ports:" ici volontairement — le service n'est joignable que
    # depuis les autres conteneurs du réseau "gemlink-network".
    expose:
      - "3000"

    environment:
      ENV: production
      OLLAMA_URL: http://ollama:11434
      VIT_MODEL_PATH: checkpoints/vit_stones.pth
      YOLO_MODEL_PATH: runs/detect/runs/stone_detector/weights/best.pt
      YOLO_INFERENCE_SIZE: ${YOLO_INFERENCE_SIZE:-960}
      YOLO_MODEL_VERSION: ${YOLO_MODEL_VERSION:-yolov8-stone-detector-v1}
      VIT_MODEL_VERSION: ${VIT_MODEL_VERSION:-vit-stones-v1}
      CLIP_MODEL_VERSION: ${CLIP_MODEL_VERSION:-clip-vit-b-32-openai}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    depends_on:
      ollama:
        condition: service_started

    networks:
      - gemlink-network

    volumes:
      - ai_checkpoints:/app/checkpoints  # persiste les .pth entre redéploiements

  # ── Proxy public MINIMAL : n'expose QUE /docs, /openapi.json, /redoc ──
  # C'est le SEUL service de la stack IA qui publie un port vers l'hôte.
  ai-docs-proxy:
    image: caddy:2-alpine
    container_name: gemlink_ai_docs_proxy
    restart: unless-stopped

    ports:
      - "8081:80"  # seul point d'entrée public vers la stack IA

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

    depends_on:
      ai-orchestrator:
        condition: service_healthy

    networks:
      - gemlink-network

  # ── Serveur LLM local (agent connaissance) ──
  ollama:
    image: ollama/ollama:latest
    container_name: gemlink_ollama_server
    restart: unless-stopped

    # PAS de "ports:" non plus — Ollama n'a besoin d'être joignable QUE par
    # ai-orchestrator, jamais directement depuis l'extérieur ou depuis php.
    expose:
      - "11434"

    volumes:
      - ollama_storage:/root/.ollama

    networks:
      - gemlink-network

volumes:
  ai_checkpoints:
  ollama_storage:

networks:
  gemlink-network:
    driver: bridge
