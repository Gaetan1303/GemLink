# Local development stack only. Railway uses six independent services; see
# docs/RAILWAY_DEPLOYMENT.md. Copy .env.example to .env before starting.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &symfony-environment
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in root .env}
      ADMIN_FIXTURE_PASSWORD: ${ADMIN_FIXTURE_PASSWORD:-}
      APP_URL: http://localhost:8000
      DEFAULT_URI: http://localhost:8000
      FRONTEND_URL: http://localhost:4200
      TRUSTED_PROXIES: 127.0.0.1,REMOTE_ADDR
      TRUSTED_HOSTS: ^(localhost|127\.0\.0\.1)(:[0-9]+)?$
      CORS_ALLOW_ORIGIN: ^http://localhost:4200$
      DATABASE_URL: postgresql://${POSTGRES_USER:-gemlink}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}@postgres:5432/${POSTGRES_DB:-gemlink}?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
      MESSENGER_LOW_PRIORITY_TRANSPORT_DSN: redis://redis:6379/identification_low_priority
      MESSENGER_FAILED_TRANSPORT_DSN: doctrine://default?queue_name=failed
      MAILER_DSN: smtp://mailpit:1025
      MAILER_FROM_EMAIL: noreply@example.test
      MAILER_FROM_NAME: GemLink Dev
      AI_ENABLED: "true"
      AI_SERVICE_URL: http://ai:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in root .env}
      MEDIA_STORAGE_MODE: local
      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET: ""
      R2_ENDPOINT: ""
      R2_PUBLIC_BASE_URL: ""
      INFOMANIAK_NEWSLETTER_TOKEN: ""
      INFOMANIAK_NEWSLETTER_CLIENT_API_URL: https://api.infomaniak.com/1/newsletter
      INFOMANIAK_NEWSLETTER_DOMAIN_ID: "0"
      JWT_SECRET_KEY: config/jwt/private.pem
      JWT_PUBLIC_KEY: config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
    ports:
      - "8000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_uploads:/app/public/uploads
      - ./backend/config/jwt:/app/config/jwt:ro
    networks: [app]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async", "low_priority", "--time-limit=3600", "--memory-limit=256M", "--sleep=1"]
    environment: *symfony-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    volumes:
      - media_uploads:/app/public/uploads
      - ./backend/config/jwt:/app/config/jwt:ro
    networks: [app]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gemlink}
      POSTGRES_USER: ${POSTGRES_USER:-gemlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gemlink} -d ${POSTGRES_DB:-gemlink}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # Keep the historical Compose volume name so an existing GemLink
      # development database is never replaced by a silently empty volume.
      - database_data:/var/lib/postgresql/data
    networks: [app]

  redis:
    # Redis 7.2 is the last BSD-3-Clause series; do not float to 7.4+.
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks: [app]

  ai:
    build:
      context: ./Fastapi
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: "3000"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in root .env}
      AI_ENABLED: "true"
      VISION_ENABLED: "true"
      LLM_ENABLED: "true"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_TEXT_MODEL: qwen3:0.6b
      OLLAMA_VISION_MODEL: moondream
      DETECTOR_BACKEND: torchvision
      DETECTOR_MODEL_PATH: /app/checkpoints/detector_stones.pth
      DETECTOR_MODEL_VERSION: stone-detector-v1
      VIT_MODEL_PATH: /app/checkpoints/vit_stones.pth
      VIT_MODEL_VERSION: vit-stones-v1
      CLIP_MODEL_ARCH: ViT-B-32
      CLIP_MODEL_PATH: /app/checkpoints/clip_vit_b_32_openai.pt
      CLIP_MODEL_PRETRAINED: openai
      CLIP_MODEL_VERSION: clip-vit-b-32-openai
      MEDIA_INTERNAL_BASE_URL: http://api:8080
    expose: ["3000"]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ai_checkpoints:/app/checkpoints
      - ai_model_cache:/home/gemlink/.cache
    networks: [app]

  ollama:
    image: ollama/ollama:0.11.10
    restart: unless-stopped
    expose: ["11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ollama_data:/root/.ollama
    networks: [app]

  ollama-init:
    image: ollama/ollama:0.11.10
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama show qwen3:0.6b >/dev/null 2>&1 || ollama pull qwen3:0.6b;
        ollama show moondream >/dev/null 2>&1 || ollama pull moondream
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    networks: [app]

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [app]

volumes:
  database_data:
  redis_data:
  media_uploads:
  ai_checkpoints:
  ai_model_cache:
  ollama_data:

networks:
  app:
    driver: bridge
